<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 162" width="100%" role="img" aria-label="52-Week Contribution Activity">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.12em; fill: #737373; }
    @keyframes draw {
      0% { stroke-dashoffset: 1600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ping {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(2.1); opacity: 0; }
    }
    .pulse-line { stroke-dasharray: 1600; animation: draw 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .ping-ring { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
  </style>
